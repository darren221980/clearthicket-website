<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" width="240" height="54" fill="none">
    <defs>
        <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="50%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        <linearGradient id="ctLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#6EE7B7" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Logo Mark -->
    <g transform="translate(6, 5)">
        <!-- Outer rounded diamond / emblem -->
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#0B1B15" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" />
        <!-- Stylized interlocking thicket / leaf canopy -->
        <path d="M 22 8 C 15 15 12 24 16 32 C 17.5 35 20 37 22 37 C 24 37 26.5 35 28 32 C 32 24 29 15 22 8 Z" fill="url(#ctGrad)" filter="url(#glow)" />
        <path d="M 22 14 L 22 36" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 22 22 L 17 18" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 22 27 L 27 23" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" />
        <!-- Accent seedling dot -->
        <circle cx="22" cy="7" r="2.5" fill="#A7F3D0" />
    </g>
    <!-- Wordmark -->
    <text x="62" y="30" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
        Clear<tspan fill="#34D399">Thicket</tspan>
    </text>
    <text x="63" y="44" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#94A3B8">
        STUDIO
    </text>
</svg>
